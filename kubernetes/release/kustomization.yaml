apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: realworld-release

resources:
  - ../base
  - namespace.yaml

patches:
  - target:
      kind: Deployment
      name: realworld-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
  - target:
      kind: Deployment
      name: realworld-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5

commonLabels:
  environment: release