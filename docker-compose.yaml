version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: realworld-db
    environment:
      - POSTGRES_DB=myappdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realworld-backend
    depends_on:
      - postgres
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=myappdb
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - PORT=3001
    ports:
      - "3001:3001"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: realworld-frontend
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
    ports:
      - "80:80"  # Changed to match Dockerfile EXPOSE
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge