name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, pre-release , release ]
  pull_request:
    branches: [ main, master ]

env:
  K8S_NAMESPACE: "app-stack"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      
      - name: Install Backend Dependencies
        run: cd backend && npm ci
      
      - name: Run Backend Tests
        run: cd backend && npm test
        env:
          NODE_ENV: test
      
      - name: Install Frontend Dependencies
        run: cd frontend && npm ci
      
      - name: Run Frontend Tests
        run: cd frontend && npm test
        env:
          CI: true

  build-and-deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Minikube
        uses: manuelmbrito/minikube-action@v1.1.1
        with:
          minikube version: 'v1.32.0'
          start args: '--driver=docker'
      
      - name: Set up Minikube Docker env
        run: |
          eval $(minikube docker-env)
          echo "MINIKUBE_ACTIVE_DOCKERD=minikube" >> $GITHUB_ENV
      
      - name: Build Backend Image
        run: |
          cd backend
          docker build -t realworld-example-app_backend:latest .
          
      - name: Build Frontend Image  
        run: |
          cd frontend
          docker build -t realworld-example-app_frontend:latest .
      
      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/pre-release/* ]]; then
            echo "environment=pre-release" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "environment=release" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
      
      - name: Set up Kubernetes context
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.26.0'
      
      - name: Configure Kubernetes
        run: |
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          kubectl cluster-info
      
      - name: Deploy to Environment
        run: |
          chmod +x .github/workflows/deploy.sh
          ./.github/workflows/deploy.sh ${{ needs.build-and-deploy.outputs.environment }}
      
      - name: Verify Deployment
        run: |
          echo "📊 Deployment verification for ${{ needs.build-and-deploy.outputs.environment }}"
          kubectl get pods -n $K8S_NAMESPACE-${{ needs.build-and-deploy.outputs.environment }}
          kubectl rollout status deployment/backend -n $K8S_NAMESPACE-${{ needs.build-and-deploy.outputs.environment }} --timeout=300s
          kubectl rollout status deployment/frontend -n $K8S_NAMESPACE-${{ needs.build-and-deploy.outputs.environment }} --timeout=300s