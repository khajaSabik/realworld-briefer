name: CI/CD Pipeline - Windows

on:
  push:
    branches: [ main, master, pre-release, 'pre-release/**', 'release/**' ]

env:
  REGISTRY: docker.io
  REPOSITORY: khajasabik/realworld-example

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check Environment
        run: |
          echo "--- Checking Environment ---"
          docker --version
          minikube status
          kubectl version --client
          kubectl get nodes
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REPOSITORY }}:backend-test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REPOSITORY }}:frontend-test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Create Namespace
        run: |
          echo "Creating namespace..."
          kubectl create namespace app-stack-test --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Deploy Application
        run: |
          echo "Deploying application..."
          kubectl apply -f minikube/ -n app-stack-test
      
      - name: Update Images
        run: |
          echo "Updating images..."
          kubectl set image deployment/backend backend=${{ env.REPOSITORY }}:backend-test-${{ github.sha }} -n app-stack-test
          kubectl set image deployment/frontend frontend=${{ env.REPOSITORY }}:frontend-test-${{ github.sha }} -n app-stack-test
      
      - name: Wait for Deployment
        run: |
          echo "Waiting for deployment..."
          kubectl rollout status deployment/backend -n app-stack-test --timeout=300s
          kubectl rollout status deployment/frontend -n app-stack-test --timeout=300s
      
      - name: Show Status
        run: |
          echo "--- Deployment Status ---"
          kubectl get all -n app-stack-test
          echo "--- Application URL ---"
          minikube service frontend-nodeport -n app-stack-test --url 