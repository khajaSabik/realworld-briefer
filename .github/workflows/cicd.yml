name: CI/CD Pipeline - RealWorld App

on:
  push:
    branches: [ main, master, pre-release, pre-release/** , release/** ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: docker.io
  REPOSITORY: khajasabik/realworld-example

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Generate Docker Image Tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BRANCH_NAME_SANITIZED=$(echo $BRANCH_NAME | sed 's/[\/#]/-/g')
          
          echo "Branch: $BRANCH_NAME"
          echo "Short SHA: $SHORT_SHA"
          
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "master" ]]; then
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-latest"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-latest"
            ENV="dev"
          elif [[ "$BRANCH_NAME" == pre-release* ]]; then
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-pre-release-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-pre-release-${SHORT_SHA}"
            ENV="pre-release"
          elif [[ "$BRANCH_NAME" == release* ]]; then
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-${SHORT_SHA}"
            ENV="release"
          else
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-${BRANCH_NAME_SANITIZED}-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-${BRANCH_NAME_SANITIZED}-${SHORT_SHA}"
            ENV="dev"
          fi
          
          echo "BACKEND_TAG=$BACKEND_TAG" >> $GITHUB_ENV
          echo "FRONTEND_TAG=$FRONTEND_TAG" >> $GITHUB_ENV
          echo "ENVIRONMENT=$ENV" >> $GITHUB_ENV
          
          echo "Using tags:"
          echo "Backend: $BACKEND_TAG"
          echo "Frontend: $FRONTEND_TAG"
          echo "Environment: $ENV"
      
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Print Success Message
        run: |
          echo "✅ SUCCESS: Images pushed to Docker Hub!"
          echo "🐳 Backend: ${{ env.BACKEND_TAG }}"
          echo "🐳 Frontend: ${{ env.FRONTEND_TAG }}"
          echo "🌍 Environment: ${{ env.ENVIRONMENT }}"
          echo ""
          echo "🔗 View images at: https://hub.docker.com/r/${{ env.REPOSITORY }}"