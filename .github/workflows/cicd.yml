name: CI/CD Pipeline - RealWorld App

on:
  push:
    branches: [ main, master, pre-release, pre-release/** , release/** ]

env:
  REGISTRY: docker.io
  REPOSITORY: khajasabik/realworld-example

jobs:
  verify-secrets:
    name: Verify Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check Secrets
        run: |
          echo "🔍 Checking GitHub Secrets..."
          echo "DOCKERHUB_USERNAME length: ${#DOCKERHUB_USERNAME}"
          echo "DOCKERHUB_TOKEN length: ${#DOCKERHUB_TOKEN}"
          
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "✅ Both secrets are set"
            echo "Username: $DOCKERHUB_USERNAME"
            echo "Token starts with: ${DOCKERHUB_TOKEN:0:4}..."
          else
            echo "❌ Missing one or both secrets"
            exit 1
          fi

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: verify-secrets
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Test Docker Hub Authentication
        run: |
          echo "Testing Docker Hub authentication..."
          # Test if we can access Docker Hub
          docker pull hello-world
          docker tag hello-world ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/test-image:latest
          echo "✅ Docker Hub authentication successful"
      
      - name: Generate Docker Image Tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BRANCH_NAME_SANITIZED=$(echo $BRANCH_NAME | sed 's/[\/#]/-/g')
          
          echo "Branch: $BRANCH_NAME"
          echo "Short SHA: $SHORT_SHA"
          
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "master" ]]; then
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-latest"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-latest"
          elif [[ "$BRANCH_NAME" == pre-release* ]]; then
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-pre-release-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-pre-release-${SHORT_SHA}"
          else
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-${BRANCH_NAME_SANITIZED}-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-${BRANCH_NAME_SANITIZED}-${SHORT_SHA}"
          fi
          
          echo "BACKEND_TAG=$BACKEND_TAG" >> $GITHUB_ENV
          echo "FRONTEND_TAG=$FRONTEND_TAG" >> $GITHUB_ENV
          
          echo "Using tags:"
          echo "Backend: $BACKEND_TAG"
          echo "Frontend: $FRONTEND_TAG"
      
      - name: Build Backend Image
        run: |
          echo "Building backend image..."
          docker build -t ${{ env.BACKEND_TAG }} ./backend
          echo "✅ Backend image built successfully"
      
      - name: Build Frontend Image
        run: |
          echo "Building frontend image..."
          docker build -t ${{ env.FRONTEND_TAG }} ./frontend
          echo "✅ Frontend image built successfully"
      
      - name: Push Backend Image
        run: |
          echo "Pushing backend image to Docker Hub..."
          docker push ${{ env.BACKEND_TAG }}
          echo "✅ Backend image pushed successfully"
      
      - name: Push Frontend Image
        run: |
          echo "Pushing frontend image to Docker Hub..."
          docker push ${{ env.FRONTEND_TAG }}
          echo "✅ Frontend image pushed successfully"
      
      - name: Print Success Message
        run: |
          echo "🎉 SUCCESS: All images pushed to Docker Hub!"
          echo "🐳 Backend: ${{ env.BACKEND_TAG }}"
          echo "🐳 Frontend: ${{ env.FRONTEND_TAG }}"
          echo ""
          echo "🔗 View your images at: https://hub.docker.com/r/khajasabik/realworld-example/tags"