name: CI/CD Pipeline - RealWorld App

on:
  push:
    branches: [ main, master, pre-release, 'pre-release/**', 'release/**' ]

env:
  REGISTRY: docker.io
  REPOSITORY: khajasabik/realworld-example

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    
    outputs:
      backend-tag: ${{ steps.vars.outputs.backend-tag }}
      frontend-tag: ${{ steps.vars.outputs.frontend-tag }}
      environment: ${{ steps.vars.outputs.environment }}
      namespace: ${{ steps.vars.outputs.namespace }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Determine Environment and Tags
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          
          echo "📋 Branch: $BRANCH_NAME"
          echo "🔑 Short SHA: $SHORT_SHA"
          
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "master" ]]; then
            ENVIRONMENT="dev"
            NAMESPACE="app-stack-dev"
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-latest"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-latest"
          elif [[ "$BRANCH_NAME" == pre-release* ]]; then
            ENVIRONMENT="pre-release"
            NAMESPACE="app-stack-pre-release"
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-pre-release-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-pre-release-${SHORT_SHA}"
          elif [[ "$BRANCH_NAME" == release* ]]; then
            ENVIRONMENT="release"
            NAMESPACE="app-stack-release"
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-${SHORT_SHA}"
          else
            ENVIRONMENT="dev"
            NAMESPACE="app-stack-dev"
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-${BRANCH_NAME}-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-${BRANCH_NAME}-${SHORT_SHA}"
          fi
          
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT
          echo "backend-tag=$BACKEND_TAG" >> $GITHUB_OUTPUT
          echo "frontend-tag=$FRONTEND_TAG" >> $GITHUB_OUTPUT
          
          echo "🎯 Environment: $ENVIRONMENT"
          echo "📦 Namespace: $NAMESPACE"
          echo "🐳 Backend Tag: $BACKEND_TAG"
          echo "🐳 Frontend Tag: $FRONTEND_TAG"
      
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.backend-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.frontend-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Print Build Success
        run: |
          echo "✅ BUILD SUCCESS: Images pushed to Docker Hub!"
          echo "🏷️  Backend: ${{ steps.vars.outputs.backend-tag }}"
          echo "🏷️  Frontend: ${{ steps.vars.outputs.frontend-tag }}"
          echo "🌍 Environment: ${{ steps.vars.outputs.environment }}"
          echo "📦 Namespace: ${{ steps.vars.outputs.namespace }}"

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ needs.build-and-push.outputs.environment }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Kubernetes
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.26.0'
      
      - name: Configure Kubeconfig
        run: |
          echo "🔧 Setting up Kubernetes access..."
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info
      
      - name: Create Namespace
        run: |
          NAMESPACE="${{ needs.build-and-push.outputs.namespace }}"
          ENVIRONMENT="${{ needs.build-and-push.outputs.environment }}"
          
          echo "📦 Creating namespace: $NAMESPACE"
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          
          echo "🏷️  Labeling namespace..."
          kubectl label namespace $NAMESPACE environment=$ENVIRONMENT --overwrite
          kubectl label namespace $NAMESPACE app=realworld --overwrite
          
          echo "✅ Namespace ready: $NAMESPACE"
      
      - name: Deploy Database
        run: |
          NAMESPACE="${{ needs.build-and-push.outputs.namespace }}"
          
          echo "🗄️  Deploying database..."
          kubectl apply -f minikube/db-pvc.yaml -n $NAMESPACE
          kubectl apply -f minikube/db-deployment.yaml -n $NAMESPACE
          kubectl apply -f minikube/secrets.yaml -n $NAMESPACE
          kubectl apply -f minikube/configmap-backend.yaml -n $NAMESPACE
          kubectl apply -f minikube/configmap-frontend.yaml -n $NAMESPACE
          
          echo "⏳ Waiting for database to be ready..."
          kubectl wait --for=condition=ready pod -l app=postgres -n $NAMESPACE --timeout=180s
          echo "✅ Database is ready!"
      
      - name: Deploy Backend
        run: |
          NAMESPACE="${{ needs.build-and-push.outputs.namespace }}"
          BACKEND_IMAGE="${{ needs.build-and-push.outputs.backend-tag }}"
          
          echo "🔧 Deploying backend..."
          kubectl apply -f minikube/backend-deployment.yaml -n $NAMESPACE
          kubectl apply -f minikube/backend-service.yaml -n $NAMESPACE
          
          echo "🔄 Updating backend image: $BACKEND_IMAGE"
          kubectl set image deployment/backend backend=$BACKEND_IMAGE -n $NAMESPACE
          
          echo "⏳ Waiting for backend rollout..."
          kubectl rollout status deployment/backend -n $NAMESPACE --timeout=300s
          echo "✅ Backend deployed successfully!"
      
      - name: Deploy Frontend
        run: |
          NAMESPACE="${{ needs.build-and-push.outputs.namespace }}"
          FRONTEND_IMAGE="${{ needs.build-and-push.outputs.frontend-tag }}"
          
          echo "🎨 Deploying frontend..."
          kubectl apply -f minikube/frontend-deployment.yaml -n $NAMESPACE
          kubectl apply -f minikube/frontend-service.yaml -n $NAMESPACE
          kubectl apply -f minikube/frontend-nodeport.yaml -n $NAMESPACE
          
          echo "🔄 Updating frontend image: $FRONTEND_IMAGE"
          kubectl set image deployment/frontend frontend=$FRONTEND_IMAGE -n $NAMESPACE
          
          echo "⏳ Waiting for frontend rollout..."
          kubectl rollout status deployment/frontend -n $NAMESPACE --timeout=300s
          echo "✅ Frontend deployed successfully!"
      
      - name: Deploy Ingress (if exists)
        run: |
          NAMESPACE="${{ needs.build-and-push.outputs.namespace }}"
          
          if [ -f "minikube/ingress.yaml" ]; then
            echo "🌐 Deploying ingress..."
            kubectl apply -f minikube/ingress.yaml -n $NAMESPACE
            echo "✅ Ingress deployed!"
          else
            echo "ℹ️  No ingress.yaml found, skipping ingress deployment"
          fi
      
      - name: Verify Deployment
        run: |
          NAMESPACE="${{ needs.build-and-push.outputs.namespace }}"
          ENVIRONMENT="${{ needs.build-and-push.outputs.environment }}"
          
          echo "🔍 Verifying deployment in $NAMESPACE..."
          
          echo ""
          echo "📊 DEPLOYMENT STATUS:"
          kubectl get all -n $NAMESPACE
          
          echo ""
          echo "🐳 RUNNING IMAGES:"
          kubectl get pods -n $NAMESPACE -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[*].image}{"\n"}{end}'
          
          echo ""
          echo "✅ DEPLOYMENT SUCCESSFUL!"
          echo "🌍 Environment: $ENVIRONMENT"
          echo "📦 Namespace: $NAMESPACE"
          echo "🐳 Backend: ${{ needs.build-and-push.outputs.backend-tag }}"
          echo "🐳 Frontend: ${{ needs.build-and-push.outputs.frontend-tag }}"
          
          echo ""
          echo "🌐 ACCESS INSTRUCTIONS:"
          echo "   Run: minikube service frontend-nodeport -n $NAMESPACE --url"
          echo "   Or check: kubectl get svc -n $NAMESPACE"