name: CI/CD Pipeline - RealWorld App

on:
  push:
    branches: [ main, master, pre-release, 'pre-release/**', 'release/**' ]

env:
  REGISTRY: docker.io
  REPOSITORY: khajasabik/realworld-example

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    
    outputs:
      backend-tag: ${{ steps.tags.outputs.backend-tag }}
      frontend-tag: ${{ steps.tags.outputs.frontend-tag }}
      environment: ${{ steps.vars.outputs.environment }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Determine Environment and Tags
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          
          echo "Branch: $BRANCH_NAME"
          echo "Short SHA: $SHORT_SHA"
          
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "master" ]]; then
            ENVIRONMENT="dev"
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-latest"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-latest"
          elif [[ "$BRANCH_NAME" == pre-release* ]]; then
            ENVIRONMENT="pre-release"
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-pre-release-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-pre-release-${SHORT_SHA}"
          elif [[ "$BRANCH_NAME" == release* ]]; then
            ENVIRONMENT="release"
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-${SHORT_SHA}"
          else
            ENVIRONMENT="dev"
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-${BRANCH_NAME}-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-${BRANCH_NAME}-${SHORT_SHA}"
          fi
          
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "backend-tag=$BACKEND_TAG" >> $GITHUB_OUTPUT
          echo "frontend-tag=$FRONTEND_TAG" >> $GITHUB_OUTPUT
          
          echo "Environment: $ENVIRONMENT"
          echo "Backend Tag: $BACKEND_TAG"
          echo "Frontend Tag: $FRONTEND_TAG"
      
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.backend-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.frontend-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ needs.build-and-push.outputs.environment }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Minikube
        uses: manuelmbrito/minikube-action@v1.1.1
        with:
          minikube version: 'v1.32.0'
          start args: '--driver=docker'
      
      - name: Set up Kubernetes
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.26.0'
      
      - name: Deploy to Environment
        run: |
          ENVIRONMENT="${{ needs.build-and-push.outputs.environment }}"
          BACKEND_IMAGE="${{ needs.build-and-push.outputs.backend-tag }}"
          FRONTEND_IMAGE="${{ needs.build-and-push.outputs.frontend-tag }}"
          
          echo "🚀 Deploying to $ENVIRONMENT environment"
          echo "🐳 Backend Image: $BACKEND_IMAGE"
          echo "🐳 Frontend Image: $FRONTEND_IMAGE"
          
          # Create namespace
          kubectl create namespace app-stack-$ENVIRONMENT --dry-run=client -o yaml | kubectl apply -f -
          
          # Apply Kubernetes manifests
          kubectl apply -f minikube/ -n app-stack-$ENVIRONMENT
          
          # Update images
          kubectl set image deployment/backend backend=$BACKEND_IMAGE -n app-stack-$ENVIRONMENT
          kubectl set image deployment/frontend frontend=$FRONTEND_IMAGE -n app-stack-$ENVIRONMENT
          
          # Wait for rollout
          echo "⏳ Waiting for deployments to complete..."
          kubectl rollout status deployment/backend -n app-stack-$ENVIRONMENT --timeout=300s
          kubectl rollout status deployment/frontend -n app-stack-$ENVIRONMENT --timeout=300s
          
          echo "✅ Deployment completed to $ENVIRONMENT environment!"
          
          # Show deployment status
          echo ""
          echo "📊 Deployment Status:"
          kubectl get all -n app-stack-$ENVIRONMENT
          
          echo ""
          echo "🌐 Access your application:"
          echo "minikube service frontend-nodeport -n app-stack-$ENVIRONMENT --url"