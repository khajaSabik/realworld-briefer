name: CI/CD Pipeline - Windows Runner

on:
  push:
    branches: [ main, master, pre-release, 'pre-release/**', 'release/**' ]

env:
  REGISTRY: docker.io
  REPOSITORY: khajasabik/realworld-example

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup and Verify Environment
        run: |
          echo "🔍 Checking environment..."
          docker --version
          minikube version
          kubectl version --client
          kubectl cluster-info
          kubectl get nodes
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Determine Tags and Environment
        id: vars
        run: |
          echo "📋 Branch: ${{ github.ref }}"
          echo "🔑 SHA: ${{ github.sha }}"
          
          if [[ "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "namespace=app-stack-dev" >> $GITHUB_OUTPUT
            echo "backend-tag=${{ env.REPOSITORY }}:backend-latest" >> $GITHUB_OUTPUT
            echo "frontend-tag=${{ env.REPOSITORY }}:frontend-latest" >> $GITHUB_OUTPUT
            echo "🎯 Environment: dev"
            echo "📦 Namespace: app-stack-dev"
            echo "🐳 Backend Tag: ${{ env.REPOSITORY }}:backend-latest"
            echo "🐳 Frontend Tag: ${{ env.REPOSITORY }}:frontend-latest"
          elif [[ "${{ github.ref }}" == *"pre-release"* ]]; then
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "environment=pre-release" >> $GITHUB_OUTPUT
            echo "namespace=app-stack-pre-release" >> $GITHUB_OUTPUT
            echo "backend-tag=${{ env.REPOSITORY }}:backend-pre-release-$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "frontend-tag=${{ env.REPOSITORY }}:frontend-pre-release-$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "🎯 Environment: pre-release"
            echo "📦 Namespace: app-stack-pre-release"
            echo "🐳 Backend Tag: ${{ env.REPOSITORY }}:backend-pre-release-$SHORT_SHA"
            echo "🐳 Frontend Tag: ${{ env.REPOSITORY }}:frontend-pre-release-$SHORT_SHA"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "environment=release" >> $GITHUB_OUTPUT
            echo "namespace=app-stack-release" >> $GITHUB_OUTPUT
            echo "backend-tag=${{ env.REPOSITORY }}:backend-$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "frontend-tag=${{ env.REPOSITORY }}:frontend-$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "🎯 Environment: release"
            echo "📦 Namespace: app-stack-release"
            echo "🐳 Backend Tag: ${{ env.REPOSITORY }}:backend-$SHORT_SHA"
            echo "🐳 Frontend Tag: ${{ env.REPOSITORY }}:frontend-$SHORT_SHA"
          fi
      
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.backend-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.frontend-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Create Namespace and Labels
        run: |
          echo "📦 Creating namespace: ${{ steps.vars.outputs.namespace }}"
          kubectl create namespace ${{ steps.vars.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -
          
          echo "🏷️ Labeling namespace..."
          kubectl label namespace ${{ steps.vars.outputs.namespace }} environment=${{ steps.vars.outputs.environment }} --overwrite
          kubectl label namespace ${{ steps.vars.outputs.namespace }} app=realworld --overwrite
      
      - name: Deploy Database First
        run: |
          echo "🗄️ Deploying database resources..."
          # Apply database resources first
          kubectl apply -f minikube/secrets.yaml -n ${{ steps.vars.outputs.namespace }}
          kubectl apply -f minikube/configmap-backend.yaml -n ${{ steps.vars.outputs.namespace }}
          kubectl apply -f minikube/configmap-frontend.yaml -n ${{ steps.vars.outputs.namespace }}
          kubectl apply -f minikube/db-pvc.yaml -n ${{ steps.vars.outputs.namespace }}
          kubectl apply -f minikube/db-deployment.yaml -n ${{ steps.vars.outputs.namespace }}
          
          echo "⏳ Waiting for database to be ready..."
          kubectl wait --for=condition=ready pod -l app=postgres -n ${{ steps.vars.outputs.namespace }} --timeout=180s
          echo "✅ Database is ready!"
      
      - name: Deploy Backend Application
        run: |
          echo "🔧 Deploying backend application..."
          kubectl apply -f minikube/backend-deployment.yaml -n ${{ steps.vars.outputs.namespace }}
          kubectl apply -f minikube/backend-service.yaml -n ${{ steps.vars.outputs.namespace }}
          
          echo "🔄 Updating backend image to: ${{ steps.vars.outputs.backend-tag }}"
          kubectl set image deployment/backend backend=${{ steps.vars.outputs.backend-tag }} -n ${{ steps.vars.outputs.namespace }}
          
          echo "⏳ Waiting for backend rollout..."
          kubectl rollout status deployment/backend -n ${{ steps.vars.outputs.namespace }} --timeout=300s
          echo "✅ Backend deployed successfully!"
      
      - name: Deploy Frontend Application
        run: |
          echo "🎨 Deploying frontend application..."
          kubectl apply -f minikube/frontend-deployment.yaml -n ${{ steps.vars.outputs.namespace }}
          kubectl apply -f minikube/frontend-service.yaml -n ${{ steps.vars.outputs.namespace }}
          kubectl apply -f minikube/frontend-nodeport.yaml -n ${{ steps.vars.outputs.namespace }}
          
          echo "🔄 Updating frontend image to: ${{ steps.vars.outputs.frontend-tag }}"
          kubectl set image deployment/frontend frontend=${{ steps.vars.outputs.frontend-tag }} -n ${{ steps.vars.outputs.namespace }}
          
          echo "⏳ Waiting for frontend rollout..."
          kubectl rollout status deployment/frontend -n ${{ steps.vars.outputs.namespace }} --timeout=300s
          echo "✅ Frontend deployed successfully!"
      
      - name: Verify Complete Deployment
        run: |
          echo "🔍 Verifying deployment in namespace: ${{ steps.vars.outputs.namespace }}"
          
          echo ""
          echo "📊 DEPLOYMENT STATUS:"
          kubectl get all -n ${{ steps.vars.outputs.namespace }}
          
          echo ""
          echo "🐳 RUNNING IMAGES:"
          kubectl get pods -n ${{ steps.vars.outputs.namespace }} -o custom-columns=NAME:.metadata.name,IMAGES:.spec.containers[*].image
          
          echo ""
          echo "🎉 DEPLOYMENT SUCCESSFUL!"
          echo "🌍 Environment: ${{ steps.vars.outputs.environment }}"
          echo "📦 Namespace: ${{ steps.vars.outputs.namespace }}"
          echo "🐳 Backend Image: ${{ steps.vars.outputs.backend-tag }}"
          echo "🐳 Frontend Image: ${{ steps.vars.outputs.frontend-tag }}"
          
          echo ""
          echo "🌐 ACCESS YOUR APPLICATION:"
          minikube service frontend-nodeport -n ${{ steps.vars.outputs.namespace }} --url