name: CI/CD Pipeline - Ubuntu

on:
  push:
    branches: [ main, master, pre-release, 'pre-release/**', 'release/**' ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  REPOSITORY: khajasabik/realworld-example

jobs:
  deploy:
    name: Deploy Application
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify Ubuntu Environment
        run: |
          echo "=== Ubuntu Environment Verification ==="
          echo "OS: $(lsb_release -d | cut -f2)"
          echo "Docker:" && docker --version
          echo "Docker Compose:" && docker-compose --version
          echo "kubectl:" && kubectl version --client
          echo "Minikube:" && minikube version
          echo "Minikube Status:" && minikube status
          echo "Kubernetes Nodes:" && kubectl get nodes
          echo "✅ Ubuntu environment verified"
      
      - name: Ensure Minikube is Running
        run: |
          echo "Checking Minikube status..."
          if ! minikube status | grep -q "Running"; then
            echo "Starting Minikube cluster..."
            minikube start --driver=docker
          else
            echo "Minikube is already running"
          fi
          minikube status
      
      - name: Login to Docker Hub
        run: |
          echo "Logging into Docker Hub..."
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
      
      - name: Determine Environment and Tags
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "master" ]]; then
            ENVIRONMENT="dev"
            NAMESPACE="app-stack-dev"
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-latest"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-latest"
          elif [[ "$BRANCH_NAME" == pre-release* ]]; then
            ENVIRONMENT="pre-release"
            NAMESPACE="app-stack-pre-release"
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-pre-release-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-pre-release-${SHORT_SHA}"
          elif [[ "$BRANCH_NAME" == release* ]]; then
            ENVIRONMENT="release"
            NAMESPACE="app-stack-release"
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-${SHORT_SHA}"
          else
            ENVIRONMENT="dev"
            NAMESPACE="app-stack-dev"
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-${BRANCH_NAME}-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-${BRANCH_NAME}-${SHORT_SHA}"
          fi
          
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT
          echo "backend-tag=$BACKEND_TAG" >> $GITHUB_OUTPUT
          echo "frontend-tag=$FRONTEND_TAG" >> $GITHUB_OUTPUT
          
          echo "Environment: $ENVIRONMENT"
          echo "Namespace: $NAMESPACE"
          echo "Backend Tag: $BACKEND_TAG"
          echo "Frontend Tag: $FRONTEND_TAG"
      
      - name: Build and Push Backend
        run: |
          echo "Building backend image..."
          docker build -t ${{ steps.vars.outputs.backend-tag }} ./backend
          echo "Pushing backend image..."
          docker push ${{ steps.vars.outputs.backend-tag }}
          echo "✅ Backend image pushed: ${{ steps.vars.outputs.backend-tag }}"
      
      - name: Build and Push Frontend
        run: |
          echo "Building frontend image..."
          docker build -t ${{ steps.vars.outputs.frontend-tag }} ./frontend
          echo "Pushing frontend image..."
          docker push ${{ steps.vars.outputs.frontend-tag }}
          echo "✅ Frontend image pushed: ${{ steps.vars.outputs.frontend-tag }}"
      
      - name: Deploy to Kubernetes
        run: |
          echo "Deploying to namespace: ${{ steps.vars.outputs.namespace }}"
          
          # Create namespace
          kubectl create namespace ${{ steps.vars.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ steps.vars.outputs.namespace }} environment=${{ steps.vars.outputs.environment }} --overwrite
          
          # Apply all Kubernetes manifests
          echo "Applying Kubernetes manifests..."
          kubectl apply -f kubernetes/base/ -n ${{ steps.vars.outputs.namespace }}
          
          # Wait for database
          echo "Waiting for database to be ready..."
          kubectl wait --for=condition=ready pod -l app=postgres -n ${{ steps.vars.outputs.namespace }} --timeout=180s
          
          # Update images
          echo "Updating container images..."
          kubectl set image deployment/backend backend=${{ steps.vars.outputs.backend-tag }} -n ${{ steps.vars.outputs.namespace }}
          kubectl set image deployment/frontend frontend=${{ steps.vars.outputs.frontend-tag }} -n ${{ steps.vars.outputs.namespace }}
          
          # Wait for rollout
          echo "Waiting for deployment rollout..."
          kubectl rollout status deployment/backend -n ${{ steps.vars.outputs.namespace }} --timeout=300s
          kubectl rollout status deployment/frontend -n ${{ steps.vars.outputs.namespace }} --timeout=300s
      
      - name: Verify Deployment
        run: |
          echo "=== Deployment Verification ==="
          echo "Pods:"
          kubectl get pods -n ${{ steps.vars.outputs.namespace }}
          echo ""
          echo "Services:"
          kubectl get svc -n ${{ steps.vars.outputs.namespace }}
          echo ""
          echo "Deployments:"
          kubectl get deployments -n ${{ steps.vars.outputs.namespace }}
      
      - name: Print Access Information
        run: |
          echo "🎉 DEPLOYMENT SUCCESSFUL"
          echo "Environment: ${{ steps.vars.outputs.environment }}"
          echo "Namespace: ${{ steps.vars.outputs.namespace }}"
          echo "Backend: ${{ steps.vars.outputs.backend-tag }}"
          echo "Frontend: ${{ steps.vars.outputs.frontend-tag }}"
          echo ""
          echo "🌐 ACCESS INSTRUCTIONS:"
          echo "1. Get server IP from your cloud provider"
          echo "2. Access application at: http://SERVER_IP:30000"
          echo "3. Or use port-forward: kubectl port-forward -n ${{ steps.vars.outputs.namespace }} service/frontend-service 8080:80"
          echo "4. Then visit: http://localhost:8080"
          echo ""
          echo "🔧 Debug commands:"
          echo "   kubectl get all -n ${{ steps.vars.outputs.namespace }}"
          echo "   kubectl logs -l app=backend -n ${{ steps.vars.outputs.namespace }}"
          echo "   kubectl logs -l app=frontend -n ${{ steps.vars.outputs.namespace }}"