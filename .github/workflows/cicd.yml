name: CI/CD Pipeline - RealWorld App

on:
  push:
    branches: [ main, master, pre-release, pre-release/** , release/** ]

env:
  REGISTRY: docker.io
  REPOSITORY: khajasabik/realworld-example

jobs:
  verify-secrets:
    name: Verify Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check Secrets
        run: |
          echo "🔍 Checking GitHub Secrets..."
          echo "DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' && 'SET' || 'NOT SET' }}"
          echo "DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' && 'SET' || 'NOT SET' }}"
          
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "✅ Both secrets are set and available"
            echo "Username: ${{ secrets.DOCKERHUB_USERNAME }}"
            echo "Token is set (length hidden for security)"
          else
            echo "❌ One or both secrets are missing"
            exit 1
          fi

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: verify-secrets
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Generate Docker Image Tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BRANCH_NAME_SANITIZED=$(echo $BRANCH_NAME | sed 's/[\/#]/-/g')
          
          echo "Branch: $BRANCH_NAME"
          echo "Short SHA: $SHORT_SHA"
          
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "master" ]]; then
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-latest"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-latest"
          elif [[ "$BRANCH_NAME" == pre-release* ]]; then
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-pre-release-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-pre-release-${SHORT_SHA}"
          else
            BACKEND_TAG="${{ env.REPOSITORY }}:backend-${BRANCH_NAME_SANITIZED}-${SHORT_SHA}"
            FRONTEND_TAG="${{ env.REPOSITORY }}:frontend-${BRANCH_NAME_SANITIZED}-${SHORT_SHA}"
          fi
          
          echo "BACKEND_TAG=$BACKEND_TAG" >> $GITHUB_ENV
          echo "FRONTEND_TAG=$FRONTEND_TAG" >> $GITHUB_ENV
          
          echo "Using tags:"
          echo "Backend: $BACKEND_TAG"
          echo "Frontend: $FRONTEND_TAG"
      
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Print Success Message
        run: |
          echo "🎉 SUCCESS: All images pushed to Docker Hub!"
          echo "🐳 Backend: ${{ env.BACKEND_TAG }}"
          echo "🐳 Frontend: ${{ env.FRONTEND_TAG }}"
          echo ""
          echo "🔗 View your images at: https://hub.docker.com/r/khajasabik/realworld-example/tags"